name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: TypeScript check
        working-directory: mobile
        run: pnpm exec tsc --noEmit

      - name: Expo Android prebuild
        working-directory: mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build Android Release APK (arm64-v8a)
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Xmx3072m -Dorg.gradle.daemon=false
        run: |
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties || true
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Prepare APK artifact
        run: |
          APK_PATH="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          ls -lh "$APK_PATH"
          cp "$APK_PATH" jiancang-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiancang-android-apk
          path: jiancang-android.apk
          retention-days: 30
